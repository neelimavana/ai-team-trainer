[project]
name = "ai-team-trainer"
version = "0.1.0"
description = "Config-driven tool that trains a team of RL agents on sequential cooperative tasks and measures/mitigates catastrophic forgetting."
requires-python = ">=3.11,<3.12"
dependencies = [
    "gymnasium>=1.3.0",
    "matplotlib>=3.11.1",
    "mpe2>=1.1.0",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "pettingzoo[mpe]>=1.27.0",
    "pyyaml>=6.0.3",
    "stable-baselines3>=2.9.0",
    "torch==2.8.0",
]

# ---------------------------------------------------------------------------
# PyTorch CPU build
# ---------------------------------------------------------------------------
# The default PyPI torch wheel bundles CUDA runtime (~2.5 GB download).
# This project runs on CPU only (PRD: NFR - "no hard GPU dependency anywhere
# in the main pipeline"), so we pull the dedicated CPU wheel from PyTorch's
# cpu index. Only `torch` is routed there; everything else stays on PyPI.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
